<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RayNeo AR HUD - GTA Mode</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RayNeo HUD">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/hud.css?v=2">
  <script src="/hud-interop.js?v=2"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW reg failed: ', err));
      });
    }
  </script>
</head>
<body style="margin: 0; padding: 0; background-color: #000000; overflow: hidden;">
  <video id="ar-camera-video" playsinline autoplay muted style="position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 0; display: none; pointer-events: none;"></video>
  <div id="main" style="position: relative; z-index: 10;"></div>
</body>
</html>
