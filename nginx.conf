server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Include default system mime types
    include /etc/nginx/mime.types;

    # Custom/additional mime types
    types {
        application/wasm wasm;
        application/manifest+json webmanifest;
    }

    default_type application/octet-stream;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/wasm image/svg+xml;
    gzip_min_length 1000;

    # Antigravity Comms WebSocket Relay & Health check
    location /api/ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Ensure missing assets inside /assets/ or static extensions return 404, NEVER index.html!
    location /assets/ {
        try_files $uri =404;
    }

    location ~* \.(js|wasm|css|map)$ {
        try_files $uri =404;
    }

    # Root and SPA fallback (only for route navigation)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ensure index.html is always fresh
    location = /index.html {
        default_type text/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Service Worker must never be cached
    location = /sw.js {
        default_type text/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # PWA Manifest
    location = /manifest.json {
        default_type application/manifest+json;
    }

    # Root hud.css and hud-interop.js - no cache for immediate live updates
    location ~* ^/(hud\.css|hud-interop\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Static assets cache (images)
    location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
