server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Include default system mime types
    include /etc/nginx/mime.types;

    # Custom/additional mime types
    types {
        application/wasm wasm;
        application/manifest+json webmanifest;
    }

    default_type application/octet-stream;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/wasm image/svg+xml;
    gzip_min_length 1000;

    # Root and SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ensure index.html is always served as text/html
    location = /index.html {
        default_type text/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Service Worker
    location = /sw.js {
        default_type text/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # PWA Manifest
    location = /manifest.json {
        default_type application/manifest+json;
    }

    # Root hud.css and hud-interop.js - no cache for immediate live updates
    location ~* ^/(hud\.css|hud-interop\.js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Static assets cache (wasm and hashed bundles)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
