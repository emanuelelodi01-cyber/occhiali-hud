[package]
name = "occhiali-hud"
version = "0.1.0"
edition = "2021"
description = "GTA Style Lightweight AR HUD for RayNeo Air 4 Pro"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true

[profile.release]
opt-level = "z"
lto = true

[dependencies]
dioxus = { version = "0.7", features = ["web", "router"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }

[dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  "Navigator",
  "Geolocation",
  "Position",
  "Coordinates",
  "PositionError",
  "PositionOptions",
  "Storage",
  "Location",
  "Screen",
  "DomRect",
  "EventTarget",
  "DeviceOrientationEvent"
]
